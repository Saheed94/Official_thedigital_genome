<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<body>
  <div class="bg-mesh" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="https://thedigitalgenome.com/">
      <img src="https://thedigitalgenome.com/assets/logo.png" alt="" class="brand-logo" />

    <a class="header-link" href="index.html"><i class="fas fa-arrow-left"></i> Checkout</a>

      <p>Need help? Email <a href="mailto:support@thedigitalgenome.com">support@thedigitalgenome.com</a> or use WhatsApp on the <a href="https://thedigitalgenome.com/#contact">main site</a>.</p>

        <a class="primary" href="index.html">Try again</a>
        <a class="secondary" href="https://thedigitalgenome.com/">Main site</a>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <p>&copy; <span id="year"></span> The Digital Genome · <a href="mailto:support@thedigitalgenome.com">support@thedigitalgenome.com</a></p>
  </footer>
  <script>document.getElementById("year").textContent = String(new Date().getFullYear());</script>
